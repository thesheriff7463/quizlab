<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host Dashboard — QuizLab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">QuizLab</a>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="badge badge-green" id="liveStatus">● Auto-refreshing</span>
      <button class="btn btn-outline" onclick="refresh()">Refresh now</button>
      <button class="btn btn-outline" onclick="exportCSV()">Export CSV</button>
      <button class="btn" style="border:1.5px solid var(--red);color:var(--red)" onclick="confirmClear()">Clear all scores</button>
    </div>
  </div>
</div>

<div class="host-page">

  <div class="host-topbar">
    <div>
      <h1>Host Dashboard</h1>
      <p class="text-sm text-muted" id="lastRefresh">Loading...</p>
    </div>
    <div class="filter-wrap">
      <span class="text-sm text-muted">Filter:</span>
      <select id="quizFilter" onchange="render()">
        <option value="all">All quizzes</option>
      </select>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-num" id="sStudents">0</div>
      <div class="stat-label">Students</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sAvg">—</div>
      <div class="stat-label">Avg score</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sHigh">—</div>
      <div class="stat-label">Top score</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sLow">—</div>
      <div class="stat-label">Lowest score</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sCheats" style="color:var(--red)">0</div>
      <div class="stat-label">Cheat flags</div>
    </div>
  </div>

  <div class="host-grid">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-head-title">🏆 Leaderboard</span>
        <span class="text-sm text-muted" id="lbCount">0 entries</span>
      </div>
      <div id="lbPanel"><div class="empty-panel">No scores yet. Share a quiz link below!</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-head-title">📋 All submissions</span>
        <span class="text-sm text-muted" id="subCount">0</span>
      </div>
      <div id="subPanel"><div class="empty-panel">No submissions yet.</div></div>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel" style="display:none">
    <div class="panel-head">
      <span class="panel-head-title" id="detailTitle">Student detail</span>
      <button class="btn btn-ghost" onclick="closeDetail()">✕ Close</button>
    </div>
    <div id="detailBody"></div>
  </div>

  <div class="panel mt-3">
    <div class="panel-head">
      <span class="panel-head-title">🔗 Quiz links — share these with students</span>
    </div>
    <div class="share-block" id="shareBlock"></div>
  </div>

</div>

<script src="js/quizzes.js"></script>
<script src="js/scores.js"></script>
<script>
let allScores = [];

async function init() {
  populateFilter();
  populateShareLinks();
  await refresh();
  setInterval(refresh, 5000);
}

function populateFilter() {
  const sel = document.getElementById('quizFilter');
  CATEGORIES.forEach(cat => {
    const catQuizzes = QUIZZES.filter(q => q.category === cat.id);
    if (catQuizzes.length === 0) return;
    const grp = document.createElement('optgroup');
    grp.label = cat.name;
    catQuizzes.forEach(q => {
      const opt = document.createElement('option');
      opt.value = q.id;
      opt.textContent = q.title;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
}

function populateShareLinks() {
  const base = location.href.replace('host.html', '');
  document.getElementById('shareBlock').innerHTML = QUIZZES.map(q => `
    <div class="share-row">
      <span class="share-label">${q.title}</span>
      <span class="share-code">${base}quiz.html?id=${q.id}</span>
      <button class="copy-btn" onclick="copyLink('${base}quiz.html?id=${q.id}', this)">Copy</button>
    </div>
  `).join('');
}

async function refresh() {
  try {
    allScores = await loadScores();
    render();
    document.getElementById('lastRefresh').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.warn('Refresh failed', e);
  }
}

function render() {
  const filter = document.getElementById('quizFilter').value;
  const scores = filter === 'all' ? allScores : allScores.filter(s => s.quizId === filter);

  document.getElementById('sStudents').textContent = scores.length;
  if (scores.length > 0) {
    const avg = Math.round(scores.reduce((a,b) => a + b.pct, 0) / scores.length);
    const high = Math.max(...scores.map(s => s.pct));
    const low = Math.min(...scores.map(s => s.pct));
    document.getElementById('sAvg').textContent = avg + '%';
    document.getElementById('sHigh').textContent = high + '%';
    document.getElementById('sLow').textContent = low + '%';
  } else {
    document.getElementById('sAvg').textContent = '—';
    document.getElementById('sHigh').textContent = '—';
    document.getElementById('sLow').textContent = '—';
  }
  document.getElementById('sCheats').textContent = scores.filter(s => s.cheatFlags > 0).length;

  const sorted = [...scores].sort((a,b) => b.pct - a.pct);
  const lb = document.getElementById('lbPanel');
  document.getElementById('lbCount').textContent = sorted.length + ' entries';
  if (sorted.length === 0) {
    lb.innerHTML = '<div class="empty-panel">No scores yet.</div>';
  } else {
    lb.innerHTML = sorted.slice(0,25).map((s,i) => {
      const rankClass = i===0?'gold':i===1?'silver':i===2?'bronze':'';
      const initials = s.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      return `<div class="lb-row">
        <div class="lb-rank ${rankClass}">${i+1}</div>
        <div class="lb-avatar">${initials}</div>
        <div class="lb-name">${s.name}<br><span class="text-sm text-muted">${s.quizTitle||''}</span></div>
        <div class="lb-right">
          <div class="lb-score">${s.pct}%</div>
          <div class="lb-sub">${s.score}/${s.total}</div>
          ${s.cheatFlags>0?'<span class="flag flag-cheat">'+s.cheatFlags+' flag'+(s.cheatFlags>1?'s':'')+'</span>':''}
        </div>
      </div>`;
    }).join('');
  }

  const chrono = [...scores].sort((a,b) => b.completedAt > a.completedAt ? 1 : -1);
  const sub = document.getElementById('subPanel');
  document.getElementById('subCount').textContent = chrono.length;
  if (chrono.length === 0) {
    sub.innerHTML = '<div class="empty-panel">No submissions yet.</div>';
  } else {
    sub.innerHTML = chrono.map(s => {
      const cls = s.pct>=70?'badge-green':s.pct>=40?'badge-amber':'badge-red';
      return `<div class="sub-row" onclick="showDetail('${s.id}')">
        <div class="sub-name">${s.name}</div>
        <div class="text-sm text-muted" style="margin-right:6px">${s.quizTitle||''}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="badge ${cls}">${s.pct}%</span>
          ${s.cheatFlags>0?'<span class="flag flag-cheat">'+s.cheatFlags+'x</span>':''}
        </div>
      </div>`;
    }).join('');
  }
}

function showDetail(id) {
  const s = allScores.find(x => x.id === id);
  if (!s) return;
  document.getElementById('detailPanel').style.display = 'block';
  document.getElementById('detailTitle').textContent = s.name + ' — ' + s.pct + '% (' + s.score + '/' + s.total + ')';
  document.getElementById('detailBody').innerHTML = `
    <div style="padding:10px 16px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-400);background:var(--gray-50)">
      Quiz: ${s.quizTitle} &nbsp;·&nbsp;
      Submitted: ${new Date(s.completedAt).toLocaleString()} &nbsp;·&nbsp;
      Cheat flags: <span style="color:${s.cheatFlags>0?'var(--red)':'var(--green)'};font-weight:700">${s.cheatFlags}</span>
      ${s.bestStreak ? ' &nbsp;·&nbsp; Best streak: ' + s.bestStreak : ''}
    </div>
    ${(s.breakdown||[]).map(r=>`
      <div class="breakdown-row">
        <div class="breakdown-icon ${r.correct?'c':'w'}">${r.correct?'✓':'✗'}</div>
        <div>
          <div class="breakdown-q">${r.q}</div>
          ${!r.correct?'<div class="breakdown-ans">Their answer: <strong>'+r.yourAnswer+'</strong> · Correct: <strong>'+r.correctAnswer+'</strong></div>':''}
        </div>
      </div>`).join('')}`;
  document.getElementById('detailPanel').scrollIntoView({ behavior:'smooth' });
}

function closeDetail() {
  document.getElementById('detailPanel').style.display = 'none';
}

function exportCSV() {
  const filter = document.getElementById('quizFilter').value;
  const scores = filter === 'all' ? allScores : allScores.filter(s => s.quizId === filter);
  if (!scores.length) { alert('No scores to export.'); return; }
  const rows = [['Name','Quiz','Score','Percentage','Best Streak','Cheat Flags','Submitted']];
  scores.forEach(s => rows.push([s.name, s.quizTitle, s.score+'/'+s.total, s.pct+'%', s.bestStreak||0, s.cheatFlags, new Date(s.completedAt).toLocaleString()]));
  const csv = rows.map(r => r.map(c => '"'+c+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'quizlab-scores-' + Date.now() + '.csv';
  a.click();
}

function confirmClear() {
  if (confirm('Clear ALL scores? This cannot be undone.')) {
    clearAllScores().then(refresh);
  }
}

function copyLink(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✓ Copied';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — QuizLab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="cheat-banner" id="cheatBanner">⚠️ Heads up — leaving this tab is being recorded!</div>

<div class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">QuizLab</a>
    <span class="text-sm text-muted" id="headerTitle"></span>
  </div>
</div>

<div id="screenName" class="name-screen">
  <div class="name-card">
    <div class="name-card-icon" id="nameIcon">📋</div>
    <h2 id="nameTitle">Loading...</h2>
    <p id="nameDesc">Enter your name to get started.</p>
    <input type="text" class="name-input" id="nameInput" placeholder="Your full name" maxlength="60" autocomplete="name" />
    <button class="btn btn-primary btn-lg btn-full" onclick="startQuiz()" id="startBtn">Let's go →</button>
    <p class="name-hint">Your score goes straight to your instructor.</p>
  </div>
</div>

<div id="screenQuiz" class="quiz-screen" style="display:none">
  <div class="quiz-topbar">
    <div class="quiz-topbar-progress">
      <div class="qprogress-label" id="qLabel">Question 1 of 10</div>
      <div class="qprogress-bar"><div class="qprogress-fill" id="qFill" style="width:0%"></div></div>
    </div>
    <div class="quiz-topbar-score">
      <div class="score-label">Score</div>
      <div class="score-num" id="scoreNum">0/0</div>
    </div>
  </div>
  <div class="question-section">
    <div class="question-num" id="questionNum">Question 1</div>
    <div class="question-text" id="questionText">Loading...</div>
  </div>
  <div class="feedback-bar hidden" id="feedbackBar">Correct!</div>
  <div class="answers-grid" id="answersGrid"></div>
  <div id="nextWrap" style="display:none;padding:0 1.25rem 1.5rem;max-width:780px;margin:0 auto;width:100%">
    <button class="btn btn-primary btn-lg btn-full" onclick="advance()">Next question →</button>
  </div>
</div>

<div id="screenResult" style="display:none">
  <div class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">QuizLab</a>
    </div>
  </div>
  <div class="results-screen">
    <div class="results-podium">
      <div class="results-emoji" id="resultEmoji">🎉</div>
      <div class="results-name" id="resultName"></div>
      <div class="results-sub" id="resultSub"></div>
    </div>
    <div class="score-circle">
      <div class="score-circle-pct" id="resultPct">0%</div>
      <div class="score-circle-frac" id="resultFrac">0/0</div>
    </div>
    <div class="results-stats">
      <div class="result-stat">
        <div class="result-stat-num" id="resultCorrect" style="color:#059669">0</div>
        <div class="result-stat-label">Correct</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num" id="resultWrong" style="color:#DC2626">0</div>
        <div class="result-stat-label">Incorrect</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num" id="resultStreak">0</div>
        <div class="result-stat-label">Best streak</div>
      </div>
    </div>
    <div class="results-breakdown" id="resultBreakdown"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:1rem">
      <a href="index.html" class="btn btn-outline btn-lg">Back to quizzes</a>
      <button class="btn btn-primary btn-lg" onclick="location.reload()">Try again</button>
    </div>
  </div>
</div>

<script src="js/quizzes.js"></script>
<script src="js/scores.js"></script>
<script>
let quiz, questions, currentQ = 0, score = 0;
let playerName = '';
let answered = false;
let cheatCount = 0;
let lastFlag = 0;
let results = [];
let streak = 0, bestStreak = 0;
const LETTERS = ['A','B','C','D','E'];

const params = new URLSearchParams(location.search);
const quizId = params.get('id');
quiz = QUIZZES.find(q => q.id === quizId);

if (!quiz) {
  document.getElementById('nameTitle').textContent = 'Quiz not found';
  document.getElementById('nameDesc').textContent = 'Check the link and try again.';
  document.getElementById('startBtn').disabled = true;
} else {
  const cat = CATEGORIES.find(c => c.id === quiz.category);
  document.getElementById('nameTitle').textContent = quiz.title;
  document.getElementById('nameDesc').textContent = quiz.description || '';
  document.getElementById('nameIcon').textContent = cat ? cat.icon : '📋';
  document.getElementById('headerTitle').textContent = quiz.title;
  document.title = quiz.title + ' — QuizLab';
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startQuiz();
});

function startQuiz() {
  playerName = document.getElementById('nameInput').value.trim();
  if (!playerName) {
    document.getElementById('nameInput').classList.add('error');
    document.getElementById('nameInput').focus();
    return;
  }
  questions = shuffle([...quiz.questions]);
  currentQ = 0; score = 0; streak = 0; bestStreak = 0; results = [];
  show('screenQuiz');
  setupAntiCheat();
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  document.getElementById('nextWrap').style.display = 'none';
  const q = questions[currentQ];
  const total = questions.length;
  document.getElementById('qLabel').textContent = 'Question ' + (currentQ + 1) + ' of ' + total;
  document.getElementById('qFill').style.width = Math.round((currentQ / total) * 100) + '%';
  document.getElementById('questionNum').textContent = 'Question ' + (currentQ + 1);
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('scoreNum').textContent = score + '/' + currentQ;
  document.getElementById('feedbackBar').className = 'feedback-bar hidden';
  const indexed = q.options.map((opt, i) => ({ opt, correct: i === q.answer }));
  const shuffled = shuffle(indexed);
  const grid = document.getElementById('answersGrid');
  grid.innerHTML = '';
  shuffled.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.setAttribute('data-i', i);
    btn.dataset.correct = item.correct;
    btn.dataset.text = item.opt;
    btn.innerHTML = '<span class="ans-letter">' + LETTERS[i] + '</span><span>' + item.opt + '</span>';
    btn.onclick = () => selectAnswer(btn, item.correct);
    grid.appendChild(btn);
  });
}

function selectAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;
  const allBtns = document.querySelectorAll('.ans-btn');
  allBtns.forEach(b => { b.disabled = true; });
  if (isCorrect) {
    btn.classList.add('correct');
    score++; streak++;
    if (streak > bestStreak) bestStreak = streak;
    document.getElementById('feedbackBar').className = 'feedback-bar correct';
    document.getElementById('feedbackBar').textContent = '✓ Correct!';
  } else {
    btn.classList.add('wrong');
    streak = 0;
    allBtns.forEach(b => {
      if (b.dataset.correct === 'true') {
        b.classList.add('correct');
        b.style.outline = '4px solid #fff';
        b.style.transform = 'scale(1.02)';
      } else if (b !== btn) {
        b.classList.add('dimmed');
      }
    });
    document.getElementById('feedbackBar').className = 'feedback-bar wrong';
    document.getElementById('feedbackBar').textContent = '✗ Incorrect — correct answer highlighted in green';
  }
  const correctBtn = Array.from(allBtns).find(b => b.dataset.correct === 'true');
  results.push({ q: questions[currentQ].q, correct: isCorrect, yourAnswer: btn.dataset.text, correctAnswer: correctBtn ? correctBtn.dataset.text : '' });
  document.getElementById('scoreNum').textContent = score + '/' + (currentQ + 1);

  const isLast = currentQ + 1 >= questions.length;
  const nextBtn = document.getElementById('nextWrap');
  nextBtn.style.display = 'block';
  nextBtn.querySelector('button').textContent = isLast ? 'See results →' : 'Next question →';
}

function advance() {
  currentQ++;
  if (currentQ >= questions.length) {
    finishQuiz();
  } else {
    show('screenQuiz');
    renderQuestion();
  }
}

async function finishQuiz() {
  show('screenResult');
  removeAntiCheat();
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('resultEmoji').textContent = pct === 100 ? '🏆' : pct >= 80 ? '🎉' : pct >= 60 ? '👍' : pct >= 40 ? '📚' : '💪';
  document.getElementById('resultName').textContent = playerName;
  document.getElementById('resultSub').textContent = getMessage(pct);
  document.getElementById('resultPct').textContent = pct + '%';
  document.getElementById('resultFrac').textContent = score + '/' + total;
  document.getElementById('resultCorrect').textContent = score;
  document.getElementById('resultWrong').textContent = total - score;
  document.getElementById('resultStreak').textContent = bestStreak;
  document.getElementById('resultBreakdown').innerHTML =
    '<div class="breakdown-title">Question breakdown</div>' +
    results.map(r =>
      '<div class="breakdown-row">' +
        '<div class="breakdown-icon ' + (r.correct ? 'c' : 'w') + '">' + (r.correct ? '✓' : '✗') + '</div>' +
        '<div style="flex:1">' +
          '<div class="breakdown-q">' + r.q + '</div>' +
          (!r.correct
            ? '<div class="breakdown-ans">Your answer: <strong>' + r.yourAnswer + '</strong> &nbsp;·&nbsp; Correct: <strong>' + r.correctAnswer + '</strong></div>'
            : '<div class="breakdown-ans" style="color:#059669">Correct!</div>') +
        '</div>' +
      '</div>'
    ).join('');
  try {
    await saveScore({
      id: Date.now() + '-' + Math.random().toString(36).slice(2),
      quizId: quiz.id, quizTitle: quiz.title, category: quiz.category,
      name: playerName, score, total, pct, bestStreak,
      cheatFlags: cheatCount, completedAt: new Date().toISOString(), breakdown: results
    });
  } catch(e) { console.warn('Score save failed', e); }
}

function setupAntiCheat() { document.addEventListener('visibilitychange', onVis); window.addEventListener('blur', onBlur); }
function removeAntiCheat() { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('blur', onBlur); }
function onVis() { if (document.hidden) flagCheat(); }
function onBlur() { flagCheat(); }
function flagCheat() {
  const now = Date.now();
  if (now - lastFlag < 1000) return;
  lastFlag = now;
  cheatCount++;
  const b = document.getElementById('cheatBanner');
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 3000);
}
function show(id) { ['screenName','screenQuiz','screenResult'].forEach(s => { document.getElementById(s).style.display = s === id ? (s === 'screenQuiz' ? 'flex' : 'block') : 'none'; }); }
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function getMessage(pct) {
  if (pct===100) return 'Perfect score! Absolutely nailed it.';
  if (pct>=90) return 'Outstanding! Almost perfect.';
  if (pct>=80) return 'Great work! You really know your stuff.';
  if (pct>=70) return 'Solid effort. Keep it up!';
  if (pct>=50) return 'Getting there — keep practicing!';
  return "Keep studying — you'll get it. Try again!";
}
</script>
</body>
</html>

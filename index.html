<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizLab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">QuizLab</a>
    <button onclick="goToHost()" class="btn btn-outline">Host dashboard</button>
  </div>
</div>
<div class="container">
  <div class="home-hero">
    <h1>What are we studying today?</h1>
    <p>Pick a category, choose a quiz, and go. Your score goes straight to your instructor.</p>
  </div>
  <div class="category-grid" id="catGrid"></div>
</div>
<script src="js/quizzes.js"></script>
<script>
const grid = document.getElementById('catGrid');
CATEGORIES.forEach(cat => {
  const quizCount = QUIZZES.filter(q => q.category === cat.id).length;
  if (quizCount === 0) return;
  const card = document.createElement('a');
  card.href = 'category.html?id=' + cat.id;
  card.className = 'category-card';
  card.innerHTML =
    '<div class="category-icon" style="background:' + cat.color + '22">' +
    '<span style="font-size:26px">' + cat.icon + '</span></div>' +
    '<div class="category-name">' + cat.name + '</div>' +
    '<div class="category-count">' + quizCount + ' quiz' + (quizCount !== 1 ? 'zes' : '') + '</div>';
  grid.appendChild(card);
});
if (grid.children.length === 0) {
  grid.innerHTML = '<p class="text-muted text-sm" style="text-align:center;padding:2rem;grid-column:1/-1">No quizzes added yet. Check back soon!</p>';
}

function goToHost() {
  const pw = prompt('Enter host password:');
  if (pw === 'js123') {
    window.location.href = 'host.html';
  } else if (pw !== null) {
    alert('Incorrect password.');
  }
}
</script>
</body>
</html>
